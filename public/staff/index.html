<!DOCTYPE html>
<html lang="en-GB">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<body class="login-page">

<main class="login-card">
  <h1>CoolRight</h1>
  <p class="muted">Staff area</p>
  <form id="login-form" novalidate>
    <label for="code">Access code</label>
    <input id="code" name="code" type="password" autocomplete="current-password" required autofocus />
    <p class="err" id="login-error" hidden>That code is not right.</p>
    <button type="submit" class="btn btn--primary">Sign in</button>
  </form>
</main>

<script src="/assets/js/staff-login.js?v=15203ea294"></script>
</body>
